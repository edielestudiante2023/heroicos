<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b720d2">
    <title>Sin Conexión - Academia Heroicos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #b720d2 0%, #8a189e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 1rem;
        }

        .offline-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .offline-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .offline-logo img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        .wifi-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            opacity: 0.9;
        }

        .wifi-icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .retry-btn {
            display: inline-block;
            background: white;
            color: #b720d2;
            border: none;
            padding: 0.875rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 3rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-logo">
            <img src="/assets/images/heroicos.png" alt="Heroicos" onerror="this.parentElement.innerHTML='<div style=\'font-size:2.5rem;color:#b720d2;font-weight:800\'>H</div>'">
        </div>

        <div class="wifi-icon pulse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>Sin conexión a Internet</h1>
        <p>No se puede conectar con el servidor de Academia Heroicos. Verifica tu conexión a Internet e inténtalo de nuevo.</p>

        <button class="retry-btn" onclick="window.location.reload()">
            Reintentar
        </button>

        <p class="footer-text">&copy; 2026 Academia Heroicos - Escuela de Fútbol</p>
    </div>
</body>
</html>

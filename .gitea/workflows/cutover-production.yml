name: Cutover a Produccion

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Validacion de sintaxis y credenciales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxis PHP
        run: |
          find app/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | grep -v "No syntax errors" || true
          ERRORS=$(find app/ -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | grep -c "Parse error" || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "Errores de sintaxis encontrados"
            exit 1
          fi

      - name: Buscar credenciales hardcodeadas
        run: |
          FOUND=0
          if grep -rn "SG\.[a-zA-Z0-9_-]\{20,\}" --include="*.php" app/ public/ 2>/dev/null | grep -v ".env" | grep -v ".example"; then
            FOUND=1
          fi
          if grep -rn "AVNS_[a-zA-Z0-9_-]\+" --include="*.php" app/ public/ 2>/dev/null; then
            FOUND=1
          fi
          if [ "$FOUND" -gt 0 ]; then
            echo "CRITICO: Credenciales encontradas en codigo fuente"
            exit 1
          fi
          echo "OK: Sin credenciales hardcodeadas"

  trivy:
    name: Escaneo de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  semgrep:
    name: Analisis estatico de seguridad (Semgrep)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/php
            p/secrets
            p/security-audit

  deploy-production:
    name: Deploy a Produccion
    runs-on: ubuntu-latest
    needs: [trivy, semgrep]
    steps:
      - name: Deploy via SSH a Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}
            git pull origin main
            composer install --no-dev --no-interaction --prefer-dist
            php spark migrate
            echo "Deploy produccion completado: $(date)"

      - name: Verificacion post-deploy
        run: |
          echo "Verificando disponibilidad del sitio..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.PROD_HOST }}" || echo "000")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "ALERTA: El sitio respondio con HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Sitio disponible (HTTP $HTTP_CODE)"
